<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kelime Türetme Aracı | Teknoroid</title>
<meta name="description" content="Eldeki harflerden Türkçe kelime türetin. Tahtadaki harf, joker, puan hesabı ve bingo modu ile Kelimelik ve Scrabble'da en iyi hamleyi bulun.">
<style>
:root{--red:#e8590c;--red-d:#b8450a;--red-l:#fff1e8;--dark:#111;--ink:#222;--mut:#6b7280;--line:#e5e7eb;--bg:#f5f5f5}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:transparent;color:var(--ink);padding:6px}
.tool{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(17,17,17,.07);overflow:hidden}
.head{background:var(--dark);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--red);display:grid;place-items:center;font-weight:800;font-size:1.2rem;flex:none}
.head h1{margin:0;font-size:1.15rem}
.head p{margin:2px 0 0;font-size:.8rem;color:#c9ccd1}
.body{padding:16px 20px 8px}
label,.lb{display:block;font-size:.72rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.row{display:flex;gap:8px}
input[type=text],select{width:100%;height:46px;padding:0 12px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid #dcdee6;border-radius:9px;outline:none;transition:.15s}
.row input{flex:1;min-width:0}
#rack{font-size:1.15rem;font-weight:700;letter-spacing:.12em}
input[type=text]:focus,select:focus{border-color:var(--red);background:#fff;box-shadow:0 0 0 3px rgba(232,89,12,.18)}
.btn{height:46px;padding:0 14px;border:1px solid #dcdee6;background:#fff;color:var(--mut);border-radius:9px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--red);border-color:var(--red);background:var(--red-l)}
.tiles{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:42px;margin:10px 0 2px}
.t{position:relative;width:36px;height:36px;display:grid;place-items:center;background:var(--red);color:#fff;font-weight:800;border-radius:8px;box-shadow:0 3px 0 var(--red-d)}
.t sub{position:absolute;right:4px;bottom:2px;font-size:.55rem;font-weight:700;opacity:.9}
.t.j{background:#fff;color:var(--red);border:2px dashed var(--red);box-shadow:none}
.t.b{background:var(--dark);box-shadow:0 3px 0 #000}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.note{font-size:.75rem;color:var(--red-d);margin-left:6px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:.88rem;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--red)}
#res{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.best{background:var(--dark);color:#fff;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-left:5px solid var(--red)}
.best .bl{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:#c9ccd1;font-weight:700;width:100%}
.best .bt{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.best .t{width:34px;height:34px}
.best .bs{text-align:center;background:var(--red);border-radius:10px;padding:6px 16px}
.best .bs b{display:block;font-size:1.5rem;line-height:1}
.best .bs span{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}
.stat{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;margin:14px 0 8px;gap:8px;flex-wrap:wrap}
.stat b{color:var(--red);font-size:1.1rem}
.stat small{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.c{padding:5px 8px 5px 11px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:.92rem;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.c i{font-style:normal;background:var(--red-l);color:var(--red-d);font-size:.68rem;font-weight:700;border-radius:99px;padding:1px 7px}
.c:hover{border-color:var(--red)}
.more{display:block;margin:14px auto 4px;height:40px;padding:0 20px;border:1px solid var(--red);background:#fff;color:var(--red);border-radius:9px;font:inherit;font-weight:700;cursor:pointer}
.more:hover{background:var(--red-l)}
.empty{color:var(--mut);font-size:.9rem;padding:14px;border:1px dashed #d0d3dc;border-radius:10px;text-align:center;line-height:1.9}
.ex{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:2px 9px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--ink)}
.ex:hover{border-color:var(--red);color:var(--red)}
.foot{text-align:center;font-size:.7rem;color:var(--mut);padding:6px 0 12px}
.foot a{color:var(--red);text-decoration:none;font-weight:600}
@media(max-width:560px){
  .head{padding:14px}.body{padding:14px 14px 6px}
  .opts{grid-template-columns:1fr 1fr}.opts>div:last-child{grid-column:1/-1}
  .t{width:32px;height:32px;font-size:.9rem}.btn{padding:0 10px;font-size:.8rem}
}
</style>
</head>
<body>
<div class="tool">
  <div class="head">
    <div class="logo">K</div>
    <div><h1>Kelime Türetme Aracı</h1><p>Eldeki harflerden kelime türetin, puanı en yüksek hamleyi bulun.</p></div>
  </div>
  <div class="body">
    <label for="rack">Eldeki harfler <span style="text-transform:none;letter-spacing:0;font-weight:500">(joker için * veya + Joker, en fazla 2)</span></label>
    <div class="row">
      <input type="text" id="rack" maxlength="15" placeholder="örn. yenasdal veya telfon*" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="btn" id="jk">+ Joker</button>
      <button type="button" class="btn" id="clr">Temizle</button>
    </div>
    <div style="margin-top:10px"><label for="board">Tahtadaki harf(ler) <span style="text-transform:none;letter-spacing:0;font-weight:500">(isteğe bağlı, kelime bu harfleri içermeli)</span></label>
      <input type="text" id="board" maxlength="3" placeholder="örn. k" autocomplete="off" spellcheck="false" style="font-weight:700;letter-spacing:.1em"></div>
    <div class="tiles" id="tiles"></div>

    <div class="opts">
      <div><label for="min">En az harf</label><select id="min"></select></div>
      <div><label for="max">En çok harf</label><select id="max"><option value="">Sınırsız</option></select></div>
      <div><label for="sort">Sıralama</label><select id="sort"><option value="p">Yüksek puan</option><option value="l">En uzun</option><option value="a">A'dan Z'ye</option></select></div>
    </div>
    <label class="chk"><input type="checkbox" id="bingo"> Bingo: eldeki tüm taşları kullan</label>
    <div id="res" aria-live="polite"></div>
  </div>
  <div class="foot">Hazırlayan: <a href="https://teknoroid.net" target="_blank" rel="noopener">Teknoroid</a></div>
</div>

<script>
const A="abcçdefgğhıijklmnoöprsştuüvyz",IX=Object.create(null);[...A].forEach((c,i)=>IX[c]=i);
// Türkçe Scrabble harf puanları (oyuna göre değişebilir)
const PT={a:1,b:3,c:4,ç:4,d:3,e:1,f:7,g:5,ğ:8,h:5,ı:2,i:1,j:10,k:1,l:1,m:2,n:1,o:2,ö:7,p:5,r:1,s:2,ş:4,t:1,u:2,ü:3,v:7,y:3,z:4};
const PV=[...A].map(c=>PT[c]);
const $=id=>document.getElementById(id),col=new Intl.Collator('tr');
const low=s=>s.replace(/İ/g,'i').replace(/I/g,'ı').toLowerCase().replace(/â/g,'a').replace(/î/g,'i').replace(/û/g,'u');
const letters=s=>[...low(s)].filter(c=>c in IX).join('');
const rackClean=s=>[...low(s).replace(/[ ?_]/g,'*')].filter(c=>c in IX||c==='*').join('');
const up=c=>c.toLocaleUpperCase('tr');
const STEP=120,SRC=['kelimeler.txt','https://teknobird.github.io/kelime-bulucu/kelimeler.txt'];
let W=[],ready=false,failed='',shown=STEP,timer,last=[];

for(let i=2;i<=15;i++){$('min').insertAdjacentHTML('beforeend',`<option value="${i}">${i} harf</option>`);$('max').insertAdjacentHTML('beforeend',`<option value="${i}">${i} harf</option>`)}

async function load(){
  failed='';ready=false;
  for(const u of SRC){
    try{const r=await fetch(u);if(!r.ok)throw 0;const t=await r.text();W=t.split('\n').filter(Boolean);if(W.length<1000)throw 0;ready=true;run();return}catch(e){}
  }
  failed=location.protocol==='file:'?'Dosya doğrudan bilgisayardan açıldı. Tarayıcı sözlüğü okuyamaz; GitHub Pages adresinden açın.':'Sözlük dosyası (kelimeler.txt) yüklenemedi. Dosyanın index.html ile aynı klasörde olduğundan emin olun.';
  run();
}
function tile(c,cls){return `<span class="t${cls?' '+cls:''}">${cls==='j'?'*':up(c)}<sub>${cls==='j'?0:PT[c]}</sub></span>`}

function run(reset){
  if(reset)shown=STEP;
  if(failed){const u=new URL('kelimeler.txt',location.href).href;$('res').innerHTML=`<div class="empty">${failed}<br><a href="${u}" target="_blank" rel="noopener" style="color:#e8590c">${u}</a><br><button class="ex" id="retry">Tekrar dene</button></div>`;return}
  const rc=rackClean($('rack').value);let jk=0;const ls=[];
  for(const c of rc){c==='*'?jk++:ls.push(c)}
  const over=jk>2;jk=Math.min(jk,2);
  const bl=[...letters($('board').value)].slice(0,3);
  $('tiles').innerHTML=ls.map(c=>tile(c)).join('')+'*'.repeat(jk).split('').map(()=>tile('','j')).join('')
    +(bl.length?'<span class="sep"></span>'+bl.map(c=>tile(c,'b')).join(''):'')+(over?'<span class="note">En fazla 2 joker kullanılır.</span>':'');
  if(!ls.length&&!jk){
    $('res').innerHTML='<div class="empty">Eldeki harflerinizi yukarıya yazın. Örnekler:<br><button class="ex" data-r="yenasdal">yenasdal</button> <button class="ex" data-r="telfon*">telfon*</button> <button class="ex" data-r="dolap" data-b="t">dolap + tahtada t</button></div>';return}
  if(!ready){$('res').innerHTML='<div class="empty">Sözlük yükleniyor…</div>';return}
  const mn=+$('min').value||2,mx=+$('max').value||99,bingo=$('bingo').checked,total=ls.length+jk+bl.length;
  const av=new Uint8Array(29),bc=new Uint8Array(29),c=new Uint8Array(29),wc=new Uint8Array(29),bk=[];
  ls.forEach(x=>av[IX[x]]++);bl.forEach(x=>{av[IX[x]]++;if(!bc[IX[x]])bk.push(IX[x]);bc[IX[x]]++});
  const out=[];
  for(const w of W){
    const wl=w.length;
    if(wl<mn||wl>mx||wl>total)continue;
    if(bingo&&wl!==total)continue;
    c.set(av);wc.fill(0);let need=0,sc=0,ok=true;
    for(let i=0;i<wl;i++){const k=IX[w[i]];wc[k]++;if(c[k]>0){c[k]--;sc+=PV[k]}else if(++need>jk){ok=false;break}}
    if(!ok)continue;
    if(bk.some(k=>wc[k]<bc[k]))continue;
    out.push({w,s:sc})}
  const so=$('sort').value;
  out.sort((a,b)=>so==='a'?col.compare(a.w,b.w):so==='l'?b.w.length-a.w.length||b.s-a.s||col.compare(a.w,b.w):b.s-a.s||b.w.length-a.w.length||col.compare(a.w,b.w));
  last={out,av,jk};render();
}
function render(){
  const {out,av,jk}=last;
  if(!out.length){$('res').innerHTML='<div class="empty">Eşleşen kelime bulunamadı. Joker eklemeyi, bingo seçeneğini kapatmayı veya harf aralığını genişletmeyi deneyin.</div>';return}
  let top=out[0];out.forEach(o=>{if(o.s>top.s||(o.s===top.s&&o.w.length>top.w.length))top=o});
  const c=new Uint8Array(av),bt=[...top.w].map(ch=>{const k=IX[ch];if(c[k]>0){c[k]--;return tile(ch)}return tile(ch,'j')}).join('');
  let h=`<div class="best"><div class="bl">En yüksek puanlı kelime</div><div class="bt">${bt}</div><div class="bs"><b>${top.s}</b><span>puan</span></div></div>`;
  h+=`<div class="stat"><span><b>${out.length.toLocaleString('tr-TR')}</b> kelime bulundu</span><small>Joker harfler 0 puandır</small></div><div class="chips">${out.slice(0,shown).map(o=>`<span class="c">${o.w}<i>${o.s}</i></span>`).join('')}</div>`;
  if(out.length>shown)h+='<button type="button" class="more" id="more">Daha fazla göster</button>';
  $('res').innerHTML=h;
}
const deb=()=>{clearTimeout(timer);timer=setTimeout(()=>run(true),120)};
['rack','board','min','max','sort','bingo'].forEach(id=>$(id).addEventListener(['min','max','sort','bingo'].includes(id)?'change':'input',deb));
$('jk').onclick=()=>{const v=$('rack').value;if((v.match(/[*?]/g)||[]).length<2){$('rack').value=v+'*';run(true)}$('rack').focus()};
$('clr').onclick=()=>{$('rack').value='';$('board').value='';$('min').value='2';$('max').value='';$('sort').value='p';$('bingo').checked=false;run(true)};
$('res').addEventListener('click',e=>{
  const x=e.target.closest('[data-r]');if(x){$('rack').value=x.dataset.r;$('board').value=x.dataset.b||'';run(true);return}
  if(e.target.id==='more'){shown+=STEP;render()}
  if(e.target.id==='retry'){$('res').innerHTML='<div class="empty">Sözlük yükleniyor…</div>';load()}});

function sendHeight(){try{parent.postMessage({frameHeight:Math.ceil(document.querySelector('.tool').getBoundingClientRect().height)+12},'*')}catch(e){}}
window.addEventListener('load',()=>{sendHeight();setTimeout(sendHeight,300)});
window.addEventListener('resize',sendHeight);
if(window.ResizeObserver)new ResizeObserver(sendHeight).observe(document.querySelector('.tool'));
load();run();
</script>
</body>
</html>
